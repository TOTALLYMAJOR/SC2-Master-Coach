<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protoss-inspired psionic strategy artwork</title>
  <desc id="desc">Original vector illustration of a golden psionic guardian before crystalline structures. Not official Blizzard artwork.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02070f"/>
      <stop offset="0.48" stop-color="#061529"/>
      <stop offset="1" stop-color="#130d2a"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="42%" r="54%">
      <stop offset="0" stop-color="#7cf4ff" stop-opacity=".42"/>
      <stop offset=".42" stop-color="#3bbfe8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#3bbfe8" stop-opacity="0"/>

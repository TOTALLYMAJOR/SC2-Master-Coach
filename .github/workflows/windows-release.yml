name: Windows desktop release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - v1.13-dev
    paths:
      - 'app.py'
      - 'desktop_app.py'
      - 'requirements-desktop.txt'
      - 'build_windows_*.bat'
      - 'installer/**'
      - 'static/**'
      - 'tests/**'
      - '.github/workflows/windows-release.yml'
  push:
    branches:
      - main
      - v1.13-dev
    tags:
      - 'v*'

permissions:
  contents: write

# Rapid UI work can produce several pushes in a few minutes. Only the newest
# state for each branch should consume a full Windows/PyInstaller/NSIS run.
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt

      - name: Prepare offline tactical speech model
        shell: pwsh
        run: |
          $modelName = "vosk-model-small-en-us-0.15"
          $root = Join-Path $PWD "voice_models"
          $zip = Join-Path $root "$modelName.zip"
          $modelDir = Join-Path $root $modelName
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          if (-not (Test-Path (Join-Path $modelDir "am\final.mdl"))) {
            Invoke-WebRequest -Uri "https://alphacephei.com/vosk/models/$modelName.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $root -Force
          }
          if (-not (Test-Path (Join-Path $modelDir "am\final.mdl"))) {
            throw "Offline Vosk model did not unpack correctly."
          }
          Write-Host "Offline tactical speech model ready: $modelDir"

      - name: Verify SC2 protocol compatibility
        shell: pwsh
        run: |
          python -c "import google.protobuf; from s2clientprotocol import sc2api_pb2; print(f'protobuf={google.protobuf.__version__}; sc2api_pb2=ok')"

      - name: Verify HUD JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem static -Filter *.js | ForEach-Object {
            Write-Host "Checking $($_.Name)"
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m pip install pytest
          python -m pytest -q

      - name: Build native desktop bundle
        shell: pwsh
        run: |
          # PySC2 still declares enum34, an obsolete Python 2 backport that
          # PyInstaller correctly rejects on modern Python. PySC2 itself uses
          # the standard-library enum module under Python 3.
          python -m pip uninstall -y enum34
          $voiceData = @()
          if (Test-Path "voice_models\vosk-model-small-en-us-0.15") {
            $voiceData = @("--add-data", "voice_models/vosk-model-small-en-us-0.15:voice_models/vosk-model-small-en-us-0.15")
          }
          $args = @(
            "--noconfirm", "--clean", "--windowed", "--onedir",
            "--name", "SC2 Master Coach",
            "--add-data", "static:static",
            "--collect-data", "python_strategy_science",
            "--collect-all", "vosk",
            "--collect-all", "sounddevice",
            "--collect-all", "sc2reader",
            "--collect-all", "mpyq",
            "--collect-all", "webview",
            "--collect-all", "pysc2",
            "--collect-all", "s2clientprotocol",
            "--collect-all", "s2protocol",
            "--collect-all", "google.protobuf",
            "--collect-all", "portpicker",
            "--hidden-import", "webview.platforms.edgechromium",
            "--hidden-import", "pysc2.run_configs.platforms",
            "--hidden-import", "pysc2.lib.features"
          ) + $voiceData + @("desktop_app.py")
          python -m PyInstaller @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $requiredLiveCoachAssets = @(
            "static\legacy-index.html",
            "static\strategy-library.js",
            "static\live-checkpoints.js",
            "static\coach-progression.js",
            "static\v110-hud.js",
            "static\v110-hud.css"
          )
          foreach ($relative in $requiredLiveCoachAssets) {
            $match = Get-ChildItem -Path "dist\SC2 Master Coach" -Recurse -File | Where-Object {
              $_.FullName.Replace('/', '\') -like "*$relative"
            } | Select-Object -First 1
            if (-not $match) { throw "Packaged Live Coach asset missing: $relative" }
            Write-Host "Packaged Live Coach asset: $($match.FullName)"
          }
          $scienceSchema = Get-ChildItem -Path "dist\SC2 Master Coach" -Recurse -Filter schema.sql | Where-Object { $_.FullName -match "python_strategy_science" } | Select-Object -First 1
          if (-not $scienceSchema) { throw "Packaged Strategy Science schema.sql was not found." }
          Write-Host "Packaged Strategy Science schema: $($scienceSchema.FullName)"
          if (Test-Path "voice_models\vosk-model-small-en-us-0.15") {
            $voiceModel = Get-ChildItem -Path "dist\SC2 Master Coach" -Recurse -Filter final.mdl | Where-Object { $_.FullName -match "vosk-model-small-en-us-0.15" } | Select-Object -First 1
            if (-not $voiceModel) { throw "Packaged offline Vosk model was not found." }
            Write-Host "Packaged offline tactical speech model: $($voiceModel.FullName)"
          }
          Compress-Archive -Path "dist\SC2 Master Coach\*" -DestinationPath "dist\SC2-Master-Coach-Portable.zip" -Force

      - name: Prepare zero-cost NSIS installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\out | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "installer\MicrosoftEdgeWebview2Setup.exe"
          choco install nsis.portable -y --no-progress
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = "C:\ProgramData\chocolatey\bin\makensis.exe" }
          Push-Location installer
          & $makensis "sc2-master-coach.nsi"
          $exitCode = $LASTEXITCODE
          Pop-Location
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SC2-Master-Coach-Windows
          path: |
            installer/out/SC2-Master-Coach-Setup.exe
            dist/SC2-Master-Coach-Portable.zip

      - name: Mark validated v1.13 development commit
        if: github.ref == 'refs/heads/v1.13-dev'
        shell: pwsh
        run: |
          # This non-release ref is our durable acceptance marker. Reaching this
          # step means protocol, JS syntax, pytest, PyInstaller, model packaging,
          # NSIS, and artifact upload all succeeded for the current SHA.
          git push origin "HEAD:refs/heads/v1.13-ci-green" --force
          Write-Host "Validated dev SHA: $env:GITHUB_SHA"

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "installer\out\SC2-Master-Coach-Setup.exe" "dist\SC2-Master-Coach-Portable.zip" --title "SC2 Master Coach ${{ github.ref_name }}" --generate-notes

      - name: Publish or refresh current version from main
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $match = Select-String -Path app.py -Pattern 'CURRENT_VERSION = "([^"]+)"'
          if (-not $match) { throw "CURRENT_VERSION was not found in app.py" }
          $version = $match.Matches[0].Groups[1].Value
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "installer\out\SC2-Master-Coach-Setup.exe" "dist\SC2-Master-Coach-Portable.zip" --clobber
            Write-Host "$tag release assets refreshed from validated main build $env:GITHUB_SHA."
            exit 0
          }
          gh release create $tag "installer\out\SC2-Master-Coach-Setup.exe" "dist\SC2-Master-Coach-Portable.zip" --target main --title "SC2 Master Coach $tag" --generate-notes
